<!doctype html><html lang="cs"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=JetBrains+Mono:wght@700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#101312;color:#edf1ed;font-family:Inter,sans-serif}
.glow{position:absolute;inset:0;background:
 radial-gradient(620px 420px at 82% 8%, rgba(46,232,196,.16), transparent 70%),
 radial-gradient(520px 380px at 10% 95%, rgba(167,139,250,.10), transparent 70%),
 radial-gradient(420px 300px at 55% 110%, rgba(255,169,77,.07), transparent 70%)}
.top{position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#2ee8c4,rgba(46,232,196,.35) 40%,transparent)}
.wrap{position:absolute;inset:0;display:flex;align-items:center;gap:64px;padding:0 96px}
.mark{width:250px;height:250px;flex:none;filter:drop-shadow(0 24px 50px rgba(0,0,0,.5)) drop-shadow(0 0 40px rgba(46,232,196,.18))}
.mark img{width:100%;height:100%;display:block}
.eyebrow{font:700 17px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#2ee8c4;margin:0 0 18px}
h1{margin:0;font:800 92px/1 Montserrat,sans-serif;letter-spacing:-.045em}
h1 span{color:#2ee8c4}
h2{margin:14px 0 26px;font:600 38px/1.1 Inter,sans-serif;color:#edf1ed;letter-spacing:-.02em}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{padding:8px 12px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));font:700 14px 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#b3bbb5}
.tag i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:9px;vertical-align:1px}
.url{position:absolute;right:96px;bottom:44px;font:700 16px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#7c8780}
</style></head><body>
<div class="glow"></div><div class="top"></div>
<div class="wrap">
 <div class="mark"><img src="../assets/logo-mark.svg" alt=""></div>
 <div>
  <p class="eyebrow">Ongyho digitální dílna</p>
  <h1>ongy<span>.cz</span></h1>
  <h2>Kód, automatizace a věci z filamentu.</h2>
  <div class="tags">
   <span class="tag"><i style="background:#2ee8c4"></i>Home Assistant</span>
   <span class="tag"><i style="background:#ffa94d"></i>3D tisk</span>
   <span class="tag"><i style="background:#a78bfa"></i>AI</span>
   <span class="tag"><i style="background:#7dd3fc"></i>Server &amp; síť</span>
   <span class="tag"><i style="background:#7dd3fc"></i>Deskovky</span>
  </div>
 </div>
</div>
<div class="url">HTTPS://ONGY.CZ</div>
</body></html>
