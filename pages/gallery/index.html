<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://gc.zgo.at; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://res.cloudinary.com data:; connect-src 'self' https://ongy.goatcounter.com">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()">
    <meta name="description" content="Ongy Eye - galerie fotek z 3D tisku, figurek, dronu a dalších">
    <title>Galerie | Ongy.cz</title>
    <link rel="stylesheet" href="../../css/style.css?v=20260320">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
</head>
<body>
    <main>
        <section class="page-hero">
            <div class="page-hero-content">
                <svg class="page-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="6" width="20" height="14" rx="2"/>
                    <circle cx="12" cy="13" r="4"/>
                    <path d="M6 6V5a1 1 0 011-1h3l1 2h7"/>
                </svg>
                <h1>Ongy Eye</h1>
                <p class="page-subtitle">Vizuální střípky z dílny i ze světa</p>
            </div>
        </section>

        <section class="content-section">
            <div class="gallery-categories">
                <button class="gallery-tag active" data-filter="all">Vše</button>
                <button class="gallery-tag" data-filter="3d-print">3D Tisk</button>
                <button class="gallery-tag" data-filter="miniatures">Figurky</button>
                <button class="gallery-tag" data-filter="drone">Dron</button>
                <button class="gallery-tag" data-filter="discgolf">Discgolf</button>
            </div>

            <div class="gallery-grid">
                <!-- Gallery items will be here -->
                <!-- Example structure: -->
                <!--
                <div class="gallery-item" data-category="3d-print">
                    <img src="../../assets/images/gallery/photo1.jpg" alt="Popis fotky" loading="lazy">
                    <div class="gallery-overlay">
                        <span class="gallery-caption">Název / popis</span>
                    </div>
                </div>
                -->
            </div>

            <div class="gallery-placeholder">
                <div class="gallery-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                </div>
                <p>Galerie se připravuje...</p>
                <span>Brzy zde budou fotky z 3D tisku, figurky, dron záběry a více</span>
            </div>
        </section>
    </main>

    <!-- Lightbox for fullscreen images -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close">&times;</button>
        <img src="" alt="" class="lightbox-image">
        <div class="lightbox-caption"></div>
        <button class="lightbox-prev">&#10094;</button>
        <button class="lightbox-next">&#10095;</button>
    </div>

    <script src="../../js/icons.js"></script>
    <script src="../../js/components.js"></script>
    <script src="../../js/main.js"></script>
    <script src="../../js/gallery.js"></script>
    <script src="../../js/analytics.js"></script>
</body>
</html>
